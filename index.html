  --moss-soft: #e5f0e7;

@media (prefers-color-scheme: dark) {

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgba(36,64,122,0.04) 31px 32px);

  font-family: var(--body);
  font-size: 14.5px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 14px 80px;
  display: grid;
  gap: 16px;
}
h1, h2, h3, h4 {
  font-family: var(--display);
  font-weight: 700;
  margin: 0;

.sheet {
  background: var(--sheet);

.label {

}
.num {

}
.muted { color: var(--sub); }
button { font: inherit; cursor: pointer; border: 0; background: transparent; }

.btn {
  background: var(--ai);
  color: #fff;
  border-radius: 4px;
  padding: 11px 22px;
  font-weight: 700;
  letter-spacing: 0.08em;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px -5px rgba(36,64,122,0.5);
  user-select: none;
}
.btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn.ghost {
  background: transparent;
  color: var(--ai);
  border: 1px solid var(--ai);
  box-shadow: none;
}
.btn.ghost:hover { background: var(--ai-soft); }
.btn.shu {
  background: var(--shu);
  box-shadow: 0 4px 14px -5px rgba(200,55,45,0.5);
}
.btn.big { width: 100%; padding: 14px; font-size: 16px; }

/* 出生届 */
.cert {
  position: relative;
  border: 2px solid var(--ai);
  padding: 24px 22px;
  background: var(--sheet);
  border-radius: 6px;
  box-shadow: 0 10px 30px -15px rgba(36,64,122,0.25);
}
.cert::before {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid var(--ai);
  opacity: 0.35;
  pointer-events: none;
}
.cert h2 {
  font-size: 24px;
  color: var(--ai);
  letter-spacing: 0.35em;
  margin-bottom: 4px;
}
.hanko {
  position: absolute;
  right: 18px;
  top: 18px;
  width: 66px;
  height: 66px;
  border: 3px solid var(--shu);
  border-radius: 50%;
  color: var(--shu);
  display: grid;
  place-items: center;
  font-family: var(--display);
  font-weight: 900;
  font-size: 14px;
  line-height: 1.15;
  text-align: center;
  transform: rotate(-10deg);
  opacity: 0.9;
  pointer-events: none;
  animation: stamp 0.5s cubic-bezier(0.2, 1.5, 0.5, 1);
}
@keyframes stamp {
  from { transform: scale(2.3) rotate(-35deg); opacity: 0; }
  to { transform: scale(1) rotate(-10deg); opacity: 0.9; }
}
.cert-dl {
  display: grid;
  grid-template-columns: 8em 1fr;
  gap: 8px 12px;
  margin: 16px 0 0;
  font-size: 14px;
}
.cert-dl dt { color: var(--sub); font-size: 13px; }
.cert-dl dd { margin: 0; font-weight: 500; }

  position: sticky;
  top: env(safe-area-inset-top, 6px);
  z-index: 30;
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 12px 16px;
  box-shadow: 0 8px 24px -10px rgba(0,0,0,0.25);
  display: grid;
  gap: 8px;
}
.top-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 6px 12px;
}
.age-num {
  font-family: var(--display);
  font-size: 34px;
  font-weight: 900;
  line-height: 1;
  color: var(--ai);
}
.who-box {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.who-name {
  font-size: 17px;
  font-weight: 700;
  font-family: var(--display);
}
.who-tag {
  font-size: 12px;
  background: var(--ai-soft);
  color: var(--ai);
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 500;
}
.stat-bars {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 8px;
}
@media (max-width: 600px) {
  .stat-bars { grid-template-columns: repeat(3, 1fr); gap: 6px 8px; }
}
.s-col {
  display: grid;
  gap: 2px;
}
.s-col span {
  font-size: 11px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
}
.bar-wrap {
  height: 6px;
  background: var(--rule);
  border-radius: 3px;
  overflow: hidden;
}
.bar-wrap i {
  display: block;
  height: 100%;
  border-radius: 3px;
  transition: width 0.35s ease;
}

/* 場面ピクセルキャンバス */
canvas.pixel-scene {
  width: 100%;
  aspect-ratio: 96 / 36;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #cbe9f5;
  border-radius: 4px;
}
.scene-caption {
  font-size: 12px;
  color: var(--sub);
  margin-top: 6px;
  text-align: right;
}

/* 決断カード */
.decision-wrap {
  border: 2px solid var(--shu);
  background: var(--sheet);
  border-radius: 6px;
  padding: 16px 18px;
  box-shadow: 0 10px 28px -12px rgba(200,55,45,0.4);
  display: grid;
  gap: 8px;

.choice-list {
  display: grid;
  gap: 8px;
  margin-top: 6px;

.choice-btn {

  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 10px 14px;
  color: var(--ink);
  transition: all 0.2s;

.choice-btn:hover {
  background: var(--shu-soft);
  border-color: var(--shu);

.choice-btn b { display: block; font-size: 14px; }
.choice-btn small { display: block; color: var(--sub); font-size: 11.5px; margin-top: 2px; }

.log-box {

  padding-right: 4px;
}
.ev-row {
  position: relative;
  display: grid;
  grid-template-columns: 3.8em 1fr;
  gap: 10px;
  padding: 8px 0 8px 4px;
  border-bottom: 1px dashed var(--rule);

.ev-row .age-col {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--sub);
  padding-top: 2px;
  position: relative;
}
.ev-row .age-col::after {
  content: "";
  position: absolute;
  right: -6px;
  top: 9px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--rule);
}
.ev-row.big .age-col::after { background: var(--ai); box-shadow: 0 0 0 3px var(--ai-soft); }
.ev-row.red .age-col::after { background: var(--shu); box-shadow: 0 0 0 3px var(--shu-soft); }
.ev-row.moss .age-col::after { background: var(--moss); box-shadow: 0 0 0 3px var(--moss-soft); }
.ev-row.big { background: linear-gradient(90deg, var(--ai-soft), transparent 80%); border-radius: 4px; padding-left: 8px; }
.ev-row.red { background: linear-gradient(90deg, var(--shu-soft), transparent 80%); border-radius: 4px; padding-left: 8px; }
.ev-row.moss { background: linear-gradient(90deg, var(--moss-soft), transparent 80%); border-radius: 4px; padding-left: 8px; }
.ev-row p { margin: 0; font-size: 14px; }
.ev-row.big p { font-weight: 700; color: var(--ink); }
.ev-row.red p { color: var(--shu); }
.ev-row.moss p { color: var(--moss); font-weight: 700; }
.ev-row.note p { font-family: var(--display); color: var(--ai); }

  display: flex;
  gap: 8px;
  flex-wrap: wrap;

.chip {
  background: var(--sheet);
  border: 1px solid var(--rule);
  color: var(--ink);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
}
.chip:hover { border-color: var(--ai); }
.chip[aria-pressed="true"] {

  color: var(--sheet);
  border-color: var(--ink);

/* 結末画面 */
.lifetitle {

.facts-grid {

.facts-grid div {

.bonds-list {

}
.grades-grid {

  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 10px;
}
.grades-grid div {
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 8px 4px;
  text-align: center;
  background: var(--paper);
}
.grades-grid span { font-size: 11px; color: var(--sub); display: block; }
.grades-grid b { font-family: var(--display); font-size: 22px; }
</style>

const R = Math.random;
const pick = (arr) => arr[Math.floor(R() * arr.length)];
const wpick = (items, weights) => {
  let total = weights.reduce((a, b) => a + b, 0);
  let r = R() * total;
  for (let i = 0; i < items.length; i++) {
    r -= weights[i];
    if (r <= 0) return items[i];
  }
  return items[items.length - 1];
};
const clamp = (v, min = 0, max = 100) => Math.max(min, Math.min(max, v));

// 死亡判定（人口動態統計ベース）
function checkMortality(L) {
  const age = L.age;
  let q = 0.0002;
  if (age === 0) q = L.pref.inf / L.pref.b;
  else if (age < 15) q = 0.00015;
  else if (age < 30) q = 0.00045;
  else if (age < 50) q = 0.0018;
  else if (age < 70) q = 0.0075 + (age - 50) * 0.0008;
  else if (age < 85) q = 0.028 + (age - 70) * 0.004;
  else q = 0.12 + (age - 85) * 0.015;

  if (R() < q) {
    L.alive = false;
    let cause = "病気";
    if (age === 0) cause = "乳幼児突然死症候群";
    else if (age < 20) cause = pick(["交通事故", "病気", "不慮の事故"]);
    else if (age < 50) cause = pick(["急性心不全", "交通事故", "がん"]);
    else if (age < 75) cause = pick(["肺がん", "心筋梗塞", "脳梗塞"]);
    else cause = pick(["老衰", "肺炎", "心不全", "誤嚥性肺炎"]);
    
    L.cause = cause;
    addLog(age, `${cause}のため息を引き取った。享年${age}歳。`, "red big");
    return true;
  }
  return false;
}

      addLog(age, "小田分校の木造校舎。人数が少ないからこそ、一人ひとりの声が先生にも地域にも届く。", "moss");
    } else if (F.satsumaTrip && age === 21) {
      addLog(age, "さつま町の松下さんから採れたてのお米が届いた。『いつでも帰っておいで』の手紙に胸が熱くなる。", "moss");
    } else {
      const youthLogs = [
        "授業の合間に、ふと自分の将来について考える。何を学びたいんだろう…",
        "バイト先でミスをして落ち込むが、店長が『次頑張ればいい』と笑ってくれた。",
        "友人と深夜のファミリーレストランで、生き方について朝まで語り明かした。"
      ];
      addLog(age, pick(youthLogs), "");
    }
  } else if (age <= 60) {
    // 壮年期・働き盛り
    if (age === 32 && L.married && L.kids.length === 0) {
      const kidName = pick(NAMES_M.concat(NAMES_F));
      L.kids.push(kidName);
      addLog(age, `第一子（${kidName}）が誕生！小さな手を握り、親としての実感が込み上げる。`, "big");
      L.stats.joy = clamp(L.stats.joy + 20);
    } else if (age === 40) {
      addLog(age, "不惑の40歳。地域での活動や仕事を通じて、たくさんの頼れる仲間ができた。", "moss");
      L.stats.allies = clamp(L.stats.allies + 10);
    } else if (age === 50) {
      addLog(age, "50歳。かつて自分が地域で育てられたように、今度は若い世代の『やってみたい』を応援する側に回っている。", "moss");
    } else {
      const midLogs = [
        "健康診断で少し数値が引っかかり、毎朝のウォーキングを日課にし始めた。",
        "仕事で大きなプロジェクトを完遂。仲間と乾杯したビールの味が格別だった。",
        "家族で旅行に出かけ、夕暮れの海岸線を眺めながらこれまでの歩みを振り返った。"
      ];
      addLog(age, pick(midLogs), "");
    }
  } else {
    // 高齢期〜晩年
    if (age === 65) {
      addLog(age, "65歳。第一線の仕事を後進に譲り、地域のボランティアや喫茶スペースの店番をのんびり楽しむ。", "big");
    } else if (age === 77) {
      addLog(age, "喜寿を迎えた。かつて関わった若者たちや地域の仲間がお祝いに駆けつけてくれた。", "moss");
    } else if (age === 88) {
      addLog(age, "米寿（88歳）。縁側でお茶をすすりながら、この豊かな一度きりの人生に感謝する。", "big");
    } else {
      addLog(age, "穏やかな季節の移ろいを感じながら、今日も一日を大切に過ごした。", "");
    }
  }

  // 経済・資産計算
  if (L.income > 0) {
    L.lifetime += L.income;
    L.assets += Math.round(L.income * 0.15); // 15%貯蓄
  }

  // 時事ニュースの反映
  const curY = L.birthYear + age;
  if (NEWS_EVENTS[curY] && R() < 0.6) {
    addLog(age, `【時代】${NEWS_EVENTS[curY]}`, "note");
  }

  // 決断イベントの発生チェック
  const dec = triggerDecision();
  if (dec) {
    L.pendingDec = dec;
  }

  render();
}

// 決断処理
function chooseOption(idx) {
  if (!L.pendingDec) return;
  const opt = L.pendingDec.opts[idx];
  opt.f();
  L.pendingDec = null;
  render();
}

// 人生タイトルとエピタフ決定
function getLifeSummary() {
  const F = L.flags;
  const s = L.stats.spark;
  
  let title = "「ふつうの、一度きりの人」";
  let epitaph = "大きな波風は立てず、静かに日常を積み重ねた。それでも誰かにとって、代わりのきかない大切な存在だった。";
  
  if (s >= 80 || (F.okiIntern && F.satsumaTrip)) {
    title = "「偶然の出会いから『やってみたい』を咲かせた人」";
    epitaph = "かつては何一つやりたいことが見つからなかった。けれど、知らない土地へ足を踏み入れ、泥臭く人と交わる中で、心の中に確かな灯火が灯った。頼れる町と人が、生涯の精神的支柱だった。";
  } else if (F.odaBunko || F.tatataHouse) {
    title = "「温かな居場所を見つけ、人を繋いだ人」";
    epitaph = "一歩踏み出すのは怖かった。けれど飛び込んだあの町が、世界に色をつけてくれた。人を知ることで自分を深め、誰かの安心できる居場所を守り続けた。";
  } else if (L.stats.allies >= 50) {
    title = "「町と人に愛され、頼れる支柱となった人」";
    epitaph = "どこへ行っても笑顔で迎えられ、誰かの背中をそっと押し続けた。この人が遺した温もりは、地域の記憶の中にいつまでも生き続ける。";
  } else if (L.age >= 90) {
    title = "「長い年月を穏やかに見届けた人」";
    epitaph = "一世紀近い時間を歩み、数えきれない季節を見送った。すべての出会いに感謝しながら、安らかに眠りについた。";
  }

  return { title, epitaph };
}

// ==========================================
// ドット絵ピクセルキャンバス描画
// ==========================================
function drawSceneCanvas(cv) {
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const W = 96, H = 36;
  cv.width = W; cv.height = H;
  ctx.imageSmoothingEnabled = false;

  // 背景色（空と大地）
  const isNight = L.age >= 75;
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
  if (isNight) {
    skyGrad.addColorStop(0, "#1c2536");
    skyGrad.addColorStop(1, "#2e3b52");
  } else {
    skyGrad.addColorStop(0, "#98c9e8");
    skyGrad.addColorStop(1, "#cce6f4");
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.65);

  // 大地
  const groundColor = L.flags.odaBunko ? "#4a7846" : L.flags.okiIntern ? "#40798c" : "#729b59";
  ctx.fillStyle = groundColor;
  ctx.fillRect(0, H * 0.65, W, H * 0.35);

  // 山や家並み
  ctx.fillStyle = "#335c3d";
  ctx.fillRect(8, H * 0.52, 22, H * 0.15);
  ctx.fillRect(58, H * 0.48, 28, H * 0.2);

  // 家（タタタハウスやカフェ）
  ctx.fillStyle = "#e5dfd3";
  ctx.fillRect(38, H * 0.48, 18, 10);
  ctx.fillStyle = "#a84334";
  ctx.fillRect(36, H * 0.44, 22, 4); // 屋根

  // 主人公ピクセル
  const px = 46, py = H * 0.66;
  ctx.fillStyle = L.sex === "M" ? "#22427a" : "#9b3d4a"; // 服
  ctx.fillRect(px, py, 4, 6);
  ctx.fillStyle = "#f3cb9b"; // 顔
  ctx.fillRect(px, py - 4, 4, 4);
  ctx.fillStyle = "#2c221e"; // 髪
  ctx.fillRect(px - 1, py - 5, 6, 2);

  // 仲間たち（やってみたい指数が高いと人が増える）
  if (L.stats.allies >= 30) {
    ctx.fillStyle = "#3e6b48";
    ctx.fillRect(px - 7, py + 1, 4, 5);
    ctx.fillStyle = "#f3cb9b";
    ctx.fillRect(px - 7, py - 3, 4, 4);

    ctx.fillStyle = "#b46b1d";
    ctx.fillRect(px + 7, py + 1, 4, 5);
    ctx.fillStyle = "#f3cb9b";
    ctx.fillRect(px + 7, py - 3, 4, 4);
  }
}

// ==========================================
// メインUIレンダリング
// ==========================================
function render() {
  const app = document.getElementById("app");
  if (!L) return;

  // 1. 0歳：出生届の画面
  if (L.age === 0 && L.events.length <= 1) {
    const p = L.pref;
    const pct = ((p.b / TOTAL_BIRTHS) * 100).toFixed(1);
    
    app.innerHTML = `
      <section class="cert">
        <div class="hanko">出生<br>届出</div>
        <span class="label">第八十億分の一の命の記録</span>
        <h2>出生届</h2>
        <dl class="cert-dl">
          <dt>氏名</dt><dd><b style="font-size:22px; font-family:var(--display);">${L.name}</b></dd>
          <dt>性別</dt><dd>${L.sex === "M" ? "男" : "女"}</dd>
          <dt>出生地</dt><dd>${L.home} <span class="muted">（人口 約${(p.pop/10).toFixed(0)}万人）</span></dd>
          <dt>生年</dt><dd class="num">${L.birthYear}年</dd>
          <dt>父</dt><dd>${L.dadName}（${L.dadJob}）</dd>
          <dt>母</dt><dd>${L.momName}（${L.momJob}）</dd>
          <dt>この県に生まれる確率</dt><dd class="num"><b>${pct}%</b>（年間 ${p.b.toLocaleString()}人中）</dd>
          <dt>この県の平均寿命</dt><dd class="num">${L.sex === "M" ? p.leM : p.leF}歳</dd>
        </dl>

        <div style="background:var(--ai-soft); padding:12px 14px; border-radius:4px; font-size:13.5px; margin-top:18px; line-height:1.75;">
          あなたは日本の約68万人の新生児のひとりとして産声を上げました。<br>
          どこで生まれ、誰の子として育つかは選べません。ここから、あなただけの一生が始まります。
        </div>

        <button class="btn big shu" style="margin-top:20px;" onclick="startJourney()">あゆみはじめる（0歳から開始） »</button>
      </section>
    `;
    return;
  }

  // 2. 死亡・結末画面
  if (!L.alive) {
    const summary = getLifeSummary();
    const gradeLetter = (v) => v >= 80 ? "S" : v >= 60 ? "A" : v >= 40 ? "B" : "C";
    app.innerHTML = `
      <section class="sheet cert" style="border-color:var(--shu);">
        <div class="hanko" style="border-color:var(--shu); color:var(--shu);">死亡<br>届出</div>
        <span class="label">最期の記録</span>
        <h2>${L.name} <small style="font-size:17px; color:var(--sub);">${L.age}歳</small></h2>
        <p class="muted" style="margin:2px 0 0; font-size:13px;">${L.home}生まれ・${L.currentWhere}にて永眠 ｜ 死因：${L.cause}</p>

        <div class="lifetitle">${summary.title}</div>
        <div class="epitaph">${summary.epitaph}</div>

        <div class="grades-grid">
          <div><span>やってみたい</span><b style="color:var(--shu);">${gradeLetter(L.stats.spark)}</b></div>
          <div><span>視野・理解</span><b>${gradeLetter(L.stats.horizon)}</b></div>
          <div><span>頼れる味方</span><b>${gradeLetter(L.stats.allies)}</b></div>
          <div><span>人生の幸福</span><b>${gradeLetter(L.stats.joy)}</b></div>
        </div>

        <div class="facts-grid">
          <div><span class="label">やってみたい指数</span><b class="num" style="color:var(--shu);">${L.stats.spark}%</b></div>
          <div><span class="label">視野・自己理解</span><b class="num">${L.stats.horizon}%</b></div>
          <div><span class="label">頼れる味方</span><b class="num">${L.stats.allies}%</b></div>
          <div><span class="label">最終職業</span><b>${L.job}</b></div>
          <div><span class="label">生涯稼いだお金</span><b class="num">${L.lifetime >= 10000 ? (L.lifetime/10000).toFixed(1)+"億円" : L.lifetime+"万円"}</b></div>
          <div><span class="label">遺した資産</span><b class="num">${L.assets}万円</b></div>
        </div>

        ${L.bonds.length ? `
          <div style="margin-top:16px;">
            <span class="label">人生の旅路で出会った人々</span>
            <div class="bonds-list">
              ${L.bonds.map(b => `<span class="bond-tag">${b}</span>`).join("")}
            </div>
          </div>
        ` : ""}

        <div style="margin-top:24px; display:grid; gap:10px;">
          <button class="btn big shu" onclick="restart()">もう一度、別の命として生まれる</button>
        </div>
      </section>

      <section class="sheet">
        <h3 style="font-size:17px; margin-bottom:10px;">全生涯の年表（${L.events.length}件）</h3>
        <div class="log-box">
          ${L.events.map(e => `
            <div class="ev-row ${e.cls}">
              <span class="age-col">${e.age}歳</span>
              <p>${e.text}</p>
            </div>
          `).join("")}
        </div>
      </section>
    `;
    return;
  }

  // 3. 通常プレイ中画面
  app.innerHTML = `
    <!-- トップ固定ステータス -->
    <div class="sticky-top">
      <div class="top-row">
        <div>
          <span class="age-num num">${L.age}</span><span style="font-size:14px; font-weight:700; margin-left:2px;">歳</span>
          <span class="muted" style="font-size:12px; margin-left:6px;">(${L.birthYear + L.age}年)</span>
        </div>
        <div class="who-box">
          <span class="who-name">${L.name}</span>
          <span class="who-tag">📍 ${L.currentWhere}</span>
        </div>
      </div>

      <div class="stat-bars">
        <div class="s-col">
          <span>やってみたい<b class="num">${L.stats.spark}%</b></span>
          <div class="bar-wrap"><i style="width:${L.stats.spark}%; background:var(--shu);"></i></div>
        </div>
        <div class="s-col">
          <span>視野・理解<b class="num">${L.stats.horizon}%</b></span>
          <div class="bar-wrap"><i style="width:${L.stats.horizon}%; background:var(--ai);"></i></div>
        </div>
        <div class="s-col">
          <span>頼れる味方<b class="num">${L.stats.allies}%</b></span>
          <div class="bar-wrap"><i style="width:${L.stats.allies}%; background:var(--moss);"></i></div>
        </div>
        <div class="s-col">
          <span>学力・探究<b class="num">${L.stats.study}%</b></span>
          <div class="bar-wrap"><i style="width:${L.stats.study}%; background:#556b8d;"></i></div>
        </div>
        <div class="s-col">
          <span>健康・体力<b class="num">${L.stats.health}%</b></span>
          <div class="bar-wrap"><i style="width:${L.stats.health}%; background:#2e7d32;"></i></div>
        </div>
        <div class="s-col">
          <span>幸福度<b class="num">${L.stats.joy}%</b></span>
          <div class="bar-wrap"><i style="width:${L.stats.joy}%; background:var(--amber);"></i></div>
        </div>
      </div>
    </div>

    <!-- 場面ドット絵キャンバス -->
    <div class="sheet" style="padding:12px 14px;">
      <canvas class="pixel-scene" id="sceneCanvas"></canvas>
      <div class="scene-caption">${L.school} ｜ ${L.job}${L.company ? ' (' + L.company + ')' : ''}</div>
    </div>

    <!-- 決断ボックス（選択肢がある場合） -->
    ${L.pendingDec ? `
      <div class="decision-wrap">
        <span class="label" style="color:var(--shu);">人生の岐路・決断</span>
        <h3>${L.pendingDec.title}</h3>
        <p class="muted" style="margin:0; font-size:13.5px;">${L.pendingDec.desc}</p>
        <div class="choice-list">
          ${L.pendingDec.opts.map((opt, i) => `
            <button class="choice-btn" onclick="chooseOption(${i})">
              <b>${opt.t}</b>
              <small>${opt.s}</small>
            </button>
          `).join("")}
        </div>
      </div>
    ` : `
      <div class="ctrl-row">
        <button class="btn" style="flex:1;" onclick="stepAge()">歳をひとつ重ねる (1年進める) »</button>
        <button class="chip" onclick="togglePause()">${isPaused ? "自動送り 再開 ▶" : "自動送り 停止 ❚❚"}</button>
      </div>
    `}

    <!-- 人生の足跡ログ -->
    <div class="sheet">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
        <h3 style="font-size:17px;">人生の記録</h3>
        <span class="muted" style="font-size:11.5px;">新しい順</span>
      </div>
      <div class="log-box">
        ${L.events.map(e => `
          <div class="ev-row ${e.cls}">
            <span class="age-col">${e.age}歳</span>
            <p>${e.text}</p>
          </div>
        `).join("")}
      </div>
    </div>
  `;

  // キャンバス描画
  drawSceneCanvas(document.getElementById("sceneCanvas"));
}

function startJourney() {
  L.age = 0;
  isPaused = false;
  // 1歳進めてプレイ開始
  stepAge();
  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timer = setInterval(() => {
    if (!isPaused && L && L.alive && !L.pendingDec && L.age > 0) {
      stepAge();
    }
  }, autoSpeed);
}

function togglePause() {
  isPaused = !isPaused;
  render();
}

function restart() {
  clearInterval(timer);
  isPaused = false;
  initNewBorn();
  render();
}

// 起動
initNewBorn();
render();
</script>
